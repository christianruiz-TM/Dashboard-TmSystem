# nginx delante del dashboard (servicio `web` del docker-compose.yml).
#
# Es el ÚNICO puerto publicado: `app` (next start) solo es accesible desde la
# red interna de compose. Así las cabeceras de IP que llegan a la app son
# siempre las que pone este nginx, y por eso el compose puede activar
# TRUST_PROXY=1 (auditoría con la IP real y bloqueo de login por usuario+IP).
#
# ESTADO ACTUAL: HTTP en el 80 (8081 en el servidor), solo por la VPN, igual
# que tickets. Por eso el .env lleva COOKIE_SECURE=0: con `Secure` sobre HTTP el
# navegador descartaría la cookie de sesión y no se podría entrar.
#
# PARA ACTIVAR TLS (cuando haya certificado):
#   1. En docker-compose.yml, servicio `web`: montar ./docker/certs en
#      /etc/nginx/certs:ro y publicar también el 443.
#   2. Descomentar el bloque de 443 del final y cambiar el de 80 por la
#      redirección que viene con él.
#   3. COOKIE_SECURE=1 en el .env y `docker compose up -d`.

server {
    listen 80;
    server_name _;

    # DNS interno de Docker. Con la dirección en una variable, nginx resuelve
    # `app` en cada petición (caché de 10 s): si el contenedor se recrea con
    # otra IP al actualizar, nginx no se queda apuntando a la vieja (502).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app http://app:3000;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10m;

    location / {
        proxy_pass $app;
        proxy_http_version 1.1;

        # $http_host lleva el puerto (192.168.151.38:8081). Next compara el host
        # del Origin con x-forwarded-host/host para aceptar una Server Action:
        # con $host (sin puerto) no coinciden y fallan TODOS los formularios.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # REESCRIBEN, no añaden: $proxy_add_x_forwarded_for conservaría lo que
        # mande el navegador, e ipPeticion() (src/lib/auth/audit.ts) se queda con
        # el primer valor. Así no se puede falsear la IP del rate-limit.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;

        # Streaming de los Server Components (loading/Suspense): sin buffer.
        proxy_buffering off;

        # Las consultas largas a RDBv2 pueden tardar hasta 120 s (requestTimeout
        # de mssql en src/lib/rdb/pool.ts); nginx corta a los 60 s por defecto.
        proxy_read_timeout 180s;
    }
}

